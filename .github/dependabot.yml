version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TS 7 пока не поддерживается Nest CLI и typescript-eslint
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # 8.71.0 ломает unused-imports/no-unused-imports (ложное 'Body' is defined but never used)
      - dependency-name: typescript-eslint
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
